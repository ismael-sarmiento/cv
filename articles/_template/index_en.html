<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Copy to /cv/articles/<slug>/index.html (es) and /cv/articles/<slug>/en.html (en); see docs/ARTICLES.md -->
  <title>{{ARTICLE_TITLE_EN}} · Ismael Sarmiento</title>
  <meta name="description" content="{{ARTICLE_DESCRIPTION_EN}}">
  <link rel="canonical" href="{{ARTICLE_CANONICAL_EN}}">
  <link rel="alternate" hreflang="es" href="{{ARTICLE_CANONICAL_ES}}">
  <link rel="alternate" hreflang="en" href="{{ARTICLE_CANONICAL_EN}}">
  <link rel="alternate" hreflang="x-default" href="{{ARTICLE_CANONICAL_ES}}">
  <link rel="icon" href="/assets/brand/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="stylesheet" href="/assets/ds/tokens.css">
  <link rel="stylesheet" href="/assets/ds/base.css">
  <link rel="stylesheet" href="/cv/css/cv.css">
</head>
<body>
  <header class="topbar">
    <div class="container topbar-row">
      <a class="brand" href="/?lang=en" aria-label="Ismael Sarmiento"><span class="brand-is" aria-hidden="true">Is</span><span class="brand-name" aria-hidden="true">mael Sarmiento</span></a>
      <a class="pill brand-tag" href="/cv/?lang=en">CV Online</a>
    </div>
  </header>
  <main id="main" class="container narrow article">
    <p class="eyebrow">{{ARTICLE_DATE_EN}}</p>
    <h1>{{ARTICLE_TITLE_EN}}</h1>
    <p class="lead">{{ARTICLE_DESCRIPTION_EN}}</p>
    <article>{{ARTICLE_BODY_EN}}</article>
    <p><a class="btn btn-arrow" href="/cv/?lang=en">Back to CV Online</a></p>
  </main>
  <footer class="footer"><div class="container footer-row"><span>© Ismael Sarmiento. All rights reserved.</span></div></footer>
</body>
</html>
